<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>
<body>
    <div class="login">
        <div class="form-container">
            <img class="logo" src="./assets/img/logos/logo_yard_sale.svg" alt="logo">

            <form action="/" class="form">
                <label for="email" class="label">Email address</label>
                <input class="input input-password" type="email" name="" id="email" placeholder="platzi@example.com">
                
                <label for="password" class="label">Password</label>
                <input class="input input-password" type="password" name="" id="password" placeholder="*********">

                <input type="submit" value="Log in" class="primary-button login-button">
                <a href="/">Forgot my password</a>
            </form>

            <button class="secondary-button signup-button">Sign up</button>
        </div>
    </div>
</body>
</html>
