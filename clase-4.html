<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>

<body>
    <div class="login">
        <div class="form-container">
            <h1 class="title-class4">My Account</h1>

            <form action="/" class="form">
                <div>
                    <label for="name" class="label">Name</label>
                    <input class="input input-name" type="text" name="" id="name" placeholder="Enter your Name">
                    <label for="email" class="label">Email</label>
                    <input class="input input-email" type="email" name="" id="email" placeholder="platzi@example.com">
                    <label for="password" class="label">Password</label>
                    <input class="input input-password" type="password" name="" id="password" placeholder="*********">

                    <input type="submit" value="Create" class="primary-button login-button">
                </div>
            </form>
        </div>
    </div>
</body>

</html>
